name: Multi job workflow
on: [push, workflow_dispatch]
jobs:
  lint:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v3
            - name: Install dependencies
              run: npm ci
            - name: Lint
              run:  npm run lint
  test:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v3
            - name: Install dependencies
              run: npm ci
            - name: Test
              run:  npm run test

  deploy:
      runs-on: ubuntu-latest
      needs: [lint,test]
      steps:
          - name: checkout code
            uses: actions/checkout@v3
          - name: Install dependencies
            run: npm ci
          - name: Build
            run:  npm run build
          - name: Deploy
            run:  echo "Deploying....."
          
              